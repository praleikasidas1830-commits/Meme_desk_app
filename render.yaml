services:
  - type: web
    name: meme-desk-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DESK_TOKEN
        sync: false
      - key: APP_PIN
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.8"
